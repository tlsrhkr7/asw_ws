# 출발 구역 프리셋 (맵 좌표: 트랙 왼쪽 아래 모서리 = 0,0, x 오른쪽, y 위, yaw 는 x축 기준 반시계 [rad])
# 차량 기준점 = base_link (앞뒤 차축 가운데, 지면).
# sim.launch.py(스폰 위치)와 drive.launch.py(map→odom)가 같은 값을 쓴다 → 둘 다 start:=<이름> 으로 맞춤.
# 현장에서 출발 위치가 바뀌면 여기에 추가 (금요일 연습 때 줄자로 확인).
"1":
  x: 0.67
  y: 0.18
  yaw: 1.5708
  note: "1번 출발 구역 (왼쪽 아래 세로 차로, 위쪽을 향함). 인수인계 문서 기준, 규정집 그림에서 다시 확인 필요"

# 정지선 출발 (현장 룰 "출발 위치 변경" 대비): 그 정지선 앞에 막 정차한 자리 (코스 경로의 정차 점, 앞 범퍼 = 선 8 cm 앞).
# stops_done = 이 정지선까지 지난 정지선 수 → mission_manager 가 '지금 이 정지선에 서 있음'으로 시작해
#   그 정지선의 판단(로터리 칸막이·추월 장애물·마지막 칸막이)부터 함. 경로도 이 정차 점부터.
#   ros2 launch asw_bringup drive.launch.py mission:=true start:=S4   (시뮬: sim.launch start:=S4 도 같이)
"S2":
  x: 0.672
  y: 1.629
  yaw: 1.5708
  stops_done: 1
  note: "2 정지 앞 (왼쪽 아래 세로 차로, 위쪽 향함). 다음 = 3 로터리 칸막이 판단"
"S4":
  x: 2.159
  y: 7.690
  yaw: 0.0
  stops_done: 2
  note: "4 정지선-1 앞 (추월 구간 입구, 오른쪽 향함). 다음 = 5 추월 장애물 판단"
"S6":
  x: 6.659
  y: 7.690
  yaw: 0.0
  stops_done: 3
  note: "6 정지선-2 앞 (추월 구간 끝, 오른쪽 향함). 다음 = 7 라이다(라바콘) 구간"
"S8":
  x: 6.211
  y: 2.056
  yaw: 3.1416
  stops_done: 4
  note: "8 정지선-3 앞 (가운데 T 아래 가로 차로, 왼쪽 향함). 다음 = 9 T 후진 주차"
"S11":
  x: 6.919
  y: 0.750
  yaw: 0.0
  stops_done: 5
  note: "11 정지선-4 앞 (마지막 T 앞, 오른쪽 향함). 다음 = 12 마지막 칸막이 판단 → 주정차"
