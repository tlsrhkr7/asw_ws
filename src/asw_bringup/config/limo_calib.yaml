# 실차 LIMO 오도메트리 보정 (limo_driver). 녹화 후 노트북에서 asw_review <bag> --odom 으로 구함.
#   wheel_speed_scale: 줄자로 잰 실제 거리 / odom 거리 (곧게 2~3 m 가 보고). 지금 값에 곱해서 갱신
#   steer_bias: 조향 0 명령인데 실제 차가 휘면 그 중앙 조향각 [rad] (직진 시 odom 요레이트가 0 되도록)
# 섀시가 바퀴 엔코더로 속도를 직접 내므로 바퀴 지름은 필요 없음 (펌웨어가 환산)
/**:
  ros__parameters:
    wheel_speed_scale: 1.0
    steer_bias: 0.0
    # 조향: 실제 곡률 / 보고 조향 기준 계산 곡률 (2026-11-05 녹화 3개, IMU 기준 0.46~0.51 → 0.48).
    #  다시 재려면: 녹화 후 asw_review <bag> --odom (조향별 실제 회전 표). 기본값 = kinematics.CURV_GAIN
    curv_gain: 0.48
    # 조향 한계는 limo.launch 인자 max_inner_deg (기본 50, 섀시가 49.4° 에서 자름) / odom 방향은 limo.launch yaw_source (기본 imu)
