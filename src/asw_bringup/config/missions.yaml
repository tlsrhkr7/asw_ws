# 미션 설정 (좌표 = 맵 m). 채점표 구간 번호 기준.  현장에서 바뀌면 이 파일만 고치고:
# 미리 아는 것은 평면 맵뿐 — 칸막이·장애물·사람 위치는 모름 → 전부 라이다로 판단 (objects.yaml 은 시뮬 소품용)
#   asw_route (코스 다시 만들기, 정지선 정차 위치 반영) → asw_build
# 정지선 정차: 차 앞 범퍼가 선 stop_gap 앞에 오도록 멈추고 stop_wait 초 대기 (경로에 dir ±3 으로 표시됨)

stop_gap: 0.08          # 앞 범퍼 ~ 정지선 중심 [m] (정차 오차 ±4 cm 여도 선 안 넘게 넉넉히)
stop_wait: 2.0          # 정지선에서 서 있는 시간 [s]

stop_lines:             # 선 중심 좌표. 경로가 이 근처를 지나면 그 직전에 정차
  - {name: "2 정지",        x: 0.68, y: 1.87}
  - {name: "4 정지선-1",    x: 2.40, y: 7.70}
  - {name: "6 정지선-2",    x: 6.90, y: 7.70}
  - {name: "8 정지선-3",    x: 5.97, y: 2.06}
  - {name: "11 정지선-4",   x: 7.16, y: 0.75}

# 칸막이 판단: 해당 정지선에서 멈춘 뒤 선택지마다 '그 길 경로 띠'(코스 경로 좌우 branch_half_width) 안의
# 라이다 점을 셈. check_min_points 개 이상이면 그 장은 막힘, decide_samples 장 중 과반이 막힘이면 '막힘'
# → 안 막힌 첫 선택지로 진행 (둘 다 안 막히면 첫 번째. 안전 정지는 기본 꺼짐 — 멈추면 실격 위험)
branch_half_width: 0.17   # 차로 반폭 0.2 - 3 cm (도로 밖 사람·물체 제외)
check_min_points: 4
decide_samples: 5
decisions:
  - name: "3 로터리"
    at_stop: "2 정지"
    options:                      # 순서 = 선호 순서
      - {route: B}    # 원 아래로 (route_main)
      - {route: T}    # 원 위로 (route_alt)
  - name: "12 마지막 주정차"
    at_stop: "11 정지선-4"
    options:
      - {final: L}    # 위칸 좌회전 정차
      - {final: R}    # 아래칸 우회전 정차

# 5 추월: 4번 정지선에 서 있는 동안 라이다 점을 칸(cell)에 모아 confirm 장 이상 본 칸 = 장애물 (개수·모양 상관없음).
#        decide_after 초 뒤 경로 탐색(asw_nav/overtake_plan.py)으로 모든 칸을 피하는 옆 거리 프로파일을 찾음
#        (그대로 가기 + 코사인 옮겨 타기의 연속 → 세 차로에 흩어져 있어도 지그재그). 도로 폭은 맵 노란 선으로.
#        달리는 동안 새로 확정된 칸이 지금 길과 겹치면 차 앞부터 다시 계획. 피할 길 없으면 가장 덜 겹치는 길 (멈추지 않음)
overtake:
  at_stop: "4 정지선-1"
  lanes_y: [8.10, 7.69, 7.29]   # 위 / 가운데(기본) / 아래 차로 중심
  base_lane: 1
  detect_box: [2.5, 6.5]   # x0 x1 — 이 x 범위 + 도로 안(가장자리 선 lane_margin 안쪽)의 라이다 점만 장애물 후보
  lane_margin: 0.03        # 도로 가장자리에서 이만큼 안쪽까지만 (가장자리 밖 사람·벽 제외)
  confirm: 3               # 라이다 이만큼 장에서 본 칸만 장애물로 확정 (한 장 잡음 무시)
  cell: 0.04               # 장애물 칸 크기 [m]
  decide_after: 1.5        # 4번 정지선에 이만큼 [s] 서 있으며 다 본 뒤 처음 계획 (stop_wait 2 s 안)
  x_min: 2.30              # 계획 시작 x (4번 정지선 뒤)
  x_end: 6.45              # 이 x 까지 가운데 차로로 돌아와야 함 (6번 정지선 정차점 6.66 앞)
  min_radius: 0.6          # 옮겨 타기 모양의 최소 회전반경 [m] (도화지 실측 최대 조향 ~19° → 0.58 m. 한 차로 1.09 m)
  body_l: 0.42             # 차 길이 [m] (0.322 + 앞뒤 5 cm: 장애물 지나자마자 돌아오다 뒤끝 닿는 것 방지)
  body_w: 0.22             # 차 폭 [m]
  obstacle_clear: 0.07     # 장애물 점과 차 상자 사이 여유 [m] (2026-11-07 실차 충돌 → 5 → 7 cm)
  edge_clear: 0.03         # 도로 가장자리 선과 차 사이 여유 [m]
  replan_ahead: 0.15       # 달리다 다시 계획할 때 차 앞 이만큼은 지금 길 유지 [m] (옮겨 타는 중이어도 바로)

# 코스 4가지 (asw_route 가 생성): course_<route><final>  예) course_BL = 원 아래 + 좌회전
courses:
  routes: {B: route_main, T: route_alt}
  finals: {L: signal_left, R: signal_right}
  parking: [park_t, park_t_exit]      # 8 정지선-3 지나 가운데 T 후진 주차 → 빠져나오기
  parking_in: [5.70, 2.06]            # 주차 시작점 (가로 차로)
  parking_out: [4.52, 2.06]           # 빠져나온 뒤 합류점 (park_t_exit 끝 x 4.59 보다 앞 → 후진 없이 전진으로 이어짐)
