# 미션 설정 (좌표 = 맵 m). 채점표 구간 번호 기준.  현장에서 바뀌면 이 파일만 고치고:
# 미리 아는 것은 평면 맵뿐 — 칸막이·장애물·사람 위치는 모름 → 전부 라이다로 판단 (objects.yaml 은 시뮬 소품용)
#   asw_route (코스 다시 만들기, 정지선 정차 위치 반영) → asw_build
# 정지선 정차: 차 앞 범퍼가 선 stop_gap 앞에 오도록 멈추고 stop_wait 초 대기 (경로에 dir ±3 으로 표시됨)

stop_gap: 0.08          # 앞 범퍼 ~ 정지선 중심 [m] (정차 오차 ±4 cm 여도 선 안 넘게 넉넉히)
stop_wait: 1.0          # 정지선에서 서 있는 시간 [s] (2.0 → 1.0: 2026-11-13 사용자 요청)
stop_wait_decision: 2.0   # 판단하는 정지선(decisions·overtake 의 at_stop: 로터리·추월·마지막 주정차)만 [s].
                          #  서고 0.6 초 뒤부터 라이다 5장(칸막이) / 1.5 초(추월) 모아야 해서 1 초면 출발 전에 판단 못 함

stop_lines:             # 선 중심 좌표. 경로가 이 근처를 지나면 그 직전에 정차. **순서 = 코스에서 만나는 순서** (미션 판단이 씀)
  # 2026-11-13 대회장 규정: 모든 흰 가로선에서 정차 → T 줄기 정지선(올라갈 때·내려올 때 두 번), T 줄기 끝 흰 선, 미로 앞 추가.
  #  pass: 같은 선을 여러 번 지나면 몇 번째 지날 때인지 (기본 1).
  #  mode: before_reverse = 경로가 선을 넘지 않고 그 앞에서 후진으로 바뀜 → 바뀌는 점에서 stop_wait 정차 (카메라로 위치 안 옮김:
  #        T 주차 기준 경로 유지. 그 점에서 앞 범퍼 ~ 선 중심 약 10 cm)
  - {name: "2 정지",        x: 0.68, y: 1.87}
  - {name: "4 정지선-1",    x: 2.40, y: 7.70}
  - {name: "6 정지선-2",    x: 7.00, y: 7.70}   # 2026-11-13 대회장: 회색 선(콘 구간) 시작에 붙음 (연습 맵 6.90)
  - {name: "8 정지선-3",    x: 5.97, y: 2.06}
  - {name: "T 줄기 정지선 (올라감)",  x: 5.04, y: 2.98, pass: 1}
  - {name: "T 줄기 끝 흰 선",         x: 5.04, y: 5.46, mode: before_reverse}
  - {name: "T 줄기 정지선 (내려옴)",  x: 5.04, y: 2.98, pass: 2}
  - {name: "미로 앞 정지선",          x: 3.85, y: 2.06}
  - {name: "11 정지선-4",   x: 7.144, y: 0.75}   # 2026-11-14 실측: 정지선 가운데 ~ T 꺾이는 노란 선 가운데 25 cm (맵 23.7 → 1.3 cm 옮김)

# 칸막이 판단: 정지선 approach_dist 앞부터 다가가는 동안 + 멈춘 뒤 decide_samples 장, 선택지마다 '그 길 경로 띠'
# (두 코스가 갈라지는 부분 좌우 branch_half_width) 안의 라이다 점을 셈. check_min_points 개 이상이면 그 장은 막힘.
# 막힘 표본이 가장 적은 길로 감 (막힘 표본이 모두 min_blocked 미만이면 첫 번째 = 기본). 멈추지 않음
branch_half_width: 0.22   # 갈라지는 길 띠 반폭 [m] (0.17 → 0.22: 2026-11-07 실차 로터리, 비스듬한 칸막이가 띠 가장자리에
                          #  찍혀 0~1 점. 실차 3번 비교: 22 cm 면 막힌 길 매 장 3 점 이상·열린 길 거의 0, 27 cm 는 열린 길도 벽이 잡힘)
check_min_points: 3       # 한 장에서 띠 안 점이 이만큼이면 그 장은 막힘 (4 → 3: 비스듬히 선 칸막이는 2~4 점, 2026-11-07 실차)
min_blocked: 3            # 막힘 표본이 이만큼 이상이고 다른 길의 2배보다 많으면 막힌 길 (막힘 표본이 적은 길로 감)
approach_dist: 1.5        # 판단 정지선까지 이 거리 [m] 안으로 다가가는 동안도 표본을 모음 (서서 모은 것과 함께 비교)
decide_samples: 5
decisions:
  - name: "3 로터리"
    at_stop: "2 정지"
    options:                      # 순서 = 선호 순서 (첫 번째 = 기본)
      # 기본 = 바깥 코스(원 위로 크게 돎): 그 길을 막는 칸막이는 출발 차로 바로 앞이라 라이다에 정면으로 잘 보임.
      #  막혀 있으면 오른쪽 안쪽 길(원 아래)로. (2026-11-07 사용자: 안쪽 길 칸막이는 미로 벽 옆에 비스듬히 서서 잘 안 보임)
      - {route: T}    # 원 위로 = 바깥 (route_alt)
      - {route: B}    # 원 아래로 = 안쪽, 오른쪽 (route_main)
  - name: "12 마지막 주정차"
    at_stop: "11 정지선-4"
    options:
      - {final: L}    # 위칸 좌회전 정차
      - {final: R}    # 아래칸 우회전 정차

# 5 추월: 4번 정지선에 서 있는 동안 라이다 점을 칸(cell)에 모아 confirm 장 이상 본 칸 = 장애물 (개수·모양 상관없음).
#        decide_after 초 뒤 경로 탐색(asw_nav/overtake_plan.py)으로 모든 칸을 피하는 옆 거리 프로파일을 찾음
#        (그대로 가기 + 코사인 옮겨 타기의 연속 → 세 차로에 흩어져 있어도 지그재그). 도로 폭은 맵 노란 선으로.
#        달리는 동안 새로 확정된 칸이 지금 길과 겹치면 차 앞부터 다시 계획. 피할 길 없으면 가장 덜 겹치는 길 (멈추지 않음)
overtake:
  # 2026-11-14 대회: 장애물 배치 고정(오피셜) → 수동 조종으로 지나간 궤적을 코스 경로(route_main/alt)에 넣고 라이다 계획 끔.
  #  배치가 다시 무작위가 되면 true 로 + 경로를 before_fixed_ov 백업으로 되돌릴 것
  enabled: false
  at_stop: "4 정지선-1"
  lanes_y: [8.10, 7.69, 7.29]   # 위 / 가운데(기본) / 아래 차로 중심
  base_lane: 1
  detect_box: [2.5, 6.5]   # x0 x1 — 이 x 범위 + 도로 안(가장자리 선 lane_margin 안쪽)의 라이다 점만 장애물 후보
  lane_margin: 0.03        # 도로 가장자리에서 이만큼 안쪽까지만 (가장자리 밖 사람·벽 제외)
  confirm: 3               # 라이다 이만큼 장에서 본 칸만 장애물로 확정 (한 장 잡음 무시)
  cell: 0.04               # 장애물 칸 크기 [m]
  decide_after: 1.5        # 4번 정지선에 이만큼 [s] 서 있으며 다 본 뒤 처음 계획 (stop_wait 2 s 안)
  x_min: 2.30              # 계획 시작 x (4번 정지선 뒤)
  x_end: 6.45              # 이 x 까지 가운데 차로로 돌아와야 함 (6번 정지선 정차점 6.66 앞)
  lane_mode: true          # 차로 단위 회피: 길은 위·가운데·아래 차로 가운데만, 장애물이 걸친 차로 전체를 막힘으로,
                           #  옮겨 타는 동안은 출발·도착 차로 둘 다 비어야 (2026-11-07 사용자: 차선 변경급 회피). false = 차 크기 기준
  lane_half: 0.20          # 차로 반폭 [m]: 장애물 점이 차로 가운데에서 이 안이면 그 차로 막힘
  min_radius: 0.6          # 옮겨 타기 모양의 최소 회전반경 [m] (도화지 실측 최대 조향 ~19° → 0.58 m. 한 차로 1.09 m)
  body_l: 0.42             # 차 길이 [m] (0.322 + 앞뒤 5 cm: 장애물 지나자마자 돌아오다 뒤끝 닿는 것 방지)
  body_w: 0.22             # 차 폭 [m]
  obstacle_clear: 0.07     # 장애물 점과 차 상자 사이 여유 [m] (2026-11-07 실차 충돌 → 5 → 7 cm)
  edge_clear: 0.05         # 도로 가장자리 선과 차 사이 여유 [m] (3 → 5 cm: 차로 변경 중 추종 오차 4~5 cm, 2026-11-11 실차)
  # 차로 단위로 피할 길이 없으면: 차 크기 기준(옆 거리 5 cm 간격)으로 장애물 여유를 이 순서로 줄여 가며 다시 찾음
  #  (2026-11-12 실차: 넓은 판자 3개를 세 차로에 0.72 m 간격 계단식 → 차로 단위는 불가 → 첫 판자로 직진.
  #   같은 배치에서 여유 4 cm 면 지그재그 길이 나옴). 그래도 없으면 가장 덜 겹치는 길
  fallback_clear: [0.07, 0.05, 0.04, 0.03]
  fallback_min_radius: 0.58  # 도화지 실측 최소 반경
  # 멀리서 본 장애물을 실제 크기로 키워 계획: 옆 ±obstacle_pad, 뒤(먼 쪽) obstacle_depth (2026-11-12 녹화, 종이컵 묶음:
  #  4번 정지선에서는 한쪽 4~12 cm 좁고 앞면만 보여 깊이 4 cm(실제 12) → 첫 계획이 실제 장애물과 겹침)
  obstacle_pad: 0.04
  obstacle_depth: 0.08
  replan_moving: new       # 달리는 동안: new = 4번 정지선에서 정한 길 고정, 가려졌던 '새' 장애물(아는 것에서
                           #  new_obstacle_dist 넘게 떨어짐)이 길과 겹칠 때, 또는 아는 장애물이 가까이서 더 크게 보여
                           #  (키운 모양이) 길과 replan_clear 안으로 겹칠 때만 다시 계획해 다시 고정
                           #  (2026-11-07 사용자). false = 완전 고정, always = 아래 조건마다 다시 계획
  new_obstacle_dist: 0.25  # 이미 아는 장애물 덩어리에서 이 거리 [m] 넘게 떨어져야 '새' 장애물
  replan_ahead: 0.15       # 달리다 다시 계획할 때 차 앞 이만큼은 지금 길 유지 [m] (옮겨 타는 중이어도 바로)
  replan_clear: 0.02       # 지금 길이 장애물과 이 여유 [m] 안으로 겹칠 때만 다시 계획 (계획 여유 7 cm 보다 작게 → 덜 흔들림)
  replan_look: 1.5         # 차 앞 이 거리 [m] 안의 겹침만 봄

# 코스 4가지 (asw_route 가 생성): course_<route><final>  예) course_BL = 원 아래 + 좌회전
courses:
  routes: {B: route_main, T: route_alt}
  finals: {L: signal_left, R: signal_right}
  parking: [park_t, park_t_exit]      # 8 정지선-3 지나 가운데 T 후진 주차 → 빠져나오기
  parking_in: [5.70, 2.06]            # 주차 시작점 (가로 차로)
  parking_out: [4.52, 2.06]           # 빠져나온 뒤 합류점 (park_t_exit 끝 x 4.59 보다 앞 → 후진 없이 전진으로 이어짐)
